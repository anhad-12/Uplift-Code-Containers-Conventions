name: uplift
on: [pull_request]
permissions:
  contents: read
  pull-requests: write
jobs:
  uplift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e engine
      - name: Build PR patch
        id: patch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/$BASE_REF"...HEAD --relative=sample-app -- sample-app > /tmp/pr.patch
          if [ ! -s /tmp/pr.patch ]; then
            echo "No changes in sample-app — skipping Uplift analysis."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      - name: Run Uplift graph
        if: steps.patch.outputs.has_changes == 'true'
        run: uplift graph --repo sample-app --patch /tmp/pr.patch --applied --out .uplift/graph.json
      - name: Assemble report
        if: steps.patch.outputs.has_changes == 'true'
        run: uplift report --graph .uplift/graph.json --scenario pr --title "Pull request" --out reports/pr.json
      - name: Generate PR comment
        if: steps.patch.outputs.has_changes == 'true'
        run: uplift comment --report reports/pr.json > comment.md
      - name: Post PR comment
        if: steps.patch.outputs.has_changes == 'true'
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file comment.md
        env:
          GH_TOKEN: ${{ github.token }}
